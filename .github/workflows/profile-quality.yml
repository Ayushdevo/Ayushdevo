name: Profile quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate structured profile data
        run: python scripts/validate_profile.py

      - name: Run profile tests
        run: python scripts/test_profile.py

      - name: Check local Markdown links
        run: python scripts/check_links.py
