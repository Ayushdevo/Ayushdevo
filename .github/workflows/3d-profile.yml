name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # Runs every day
  workflow_dispatch:     # Allows manual triggers

# THIS IS THE MAGIC FIX: Grants permission to save the images
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      # UPGRADED TO v4 TO FIX THE NODE.JS WARNING
      - uses: actions/checkout@v4
      
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          # Added a safety catch so it doesn't fail on days you make no commits
          git commit -m "Update 3D Contribution Graph" || echo "No changes to commit"
          git push
